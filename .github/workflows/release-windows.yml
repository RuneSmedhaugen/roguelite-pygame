name: Build Windows release

on:
  release:
    types: [published]

permissions:
  contents: write

jobs:
  build-windows:
    runs-on: windows-latest
    steps:
      - name: Check out release source
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Verify release tag matches game version
        shell: pwsh
        run: |
          $versionLine = Select-String -Path core/version.py -Pattern '^VERSION = "([^"]+)"$'
          $version = $versionLine.Matches[0].Groups[1].Value
          $tagVersion = $env:GITHUB_REF_NAME.TrimStart('v')
          if ($tagVersion -ne $version) {
            throw "Release tag $($env:GITHUB_REF_NAME) does not match core/version.py ($version)."
          }

      - name: Install build dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements-build.txt

      - name: Build game and updater
        shell: pwsh
        run: |
          python tools/create_windows_icon.py
          pyinstaller --noconfirm --clean --windowed --name SmallPunchPuppies --icon assets/hammy.ico --add-data "assets;assets" main.py
          pyinstaller --noconfirm --clean --onefile --windowed --name SmallPunchPuppiesUpdater updater.py
          Copy-Item dist/SmallPunchPuppiesUpdater.exe dist/SmallPunchPuppies/SmallPunchPuppiesUpdater.exe
          Copy-Item packaging/README_FIRST.txt dist/SmallPunchPuppies/README_FIRST.txt
          Compress-Archive -Path dist/SmallPunchPuppies/* -DestinationPath SmallPunchPuppies-Windows.zip -CompressionLevel Optimal

      - name: Attach game package to the GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release upload $env:GITHUB_REF_NAME SmallPunchPuppies-Windows.zip --clobber
