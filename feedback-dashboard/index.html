<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#10131b" />
    <title>Small Punch Puppies · Feedback</title>
  </head>
  <body>
    <main class="app-shell">
      <header class="topbar">
        <a class="brand" href="#" aria-label="Small Punch Puppies feedback home">
          <span class="brand-mark">SPP</span>
          <span>Small Punch Puppies <span class="brand-muted">/ Feedback</span></span>
        </a>
        <button id="refresh-button" class="refresh-button" type="button">
          <span class="refresh-icon" aria-hidden="true">↻</span>
          Refresh
        </button>
      </header>

      <section class="page-heading">
        <div>
          <p class="eyebrow">PLAYER INBOX</p>
          <h1>Feedback</h1>
          <p class="subtitle">Bug reports and suggestions sent from the game.</p>
        </div>
        <p id="updated-at" class="updated-at">Not loaded yet</p>
      </section>

      <nav class="tabs" aria-label="Feedback type">
        <button class="tab active" data-type="bug_report" type="button">
          <span class="tab-dot bug-dot"></span>Bug reports
          <span id="bug-count" class="tab-count">—</span>
        </button>
        <button class="tab" data-type="suggestion" type="button">
          <span class="tab-dot suggestion-dot"></span>Suggestions
          <span id="suggestion-count" class="tab-count">—</span>
        </button>
      </nav>

      <section id="notice" class="notice hidden" role="status"></section>
      <section id="submissions" class="submission-list" aria-live="polite"></section>
      <footer class="footer-note">Stored privately in your Small Punch Puppies Neon database.</footer>
    </main>
    <script type="module" src="/src/main.js"></script>
  </body>
</html>
